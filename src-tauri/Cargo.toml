[package]
name = "app"
version = "0.1.0"
edition = "2021"
rust-version = "1.87.0"

[dependencies]
tauri = { version = "2.6.0", features = [] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-native-tls", "macros"] }
rusqlite = { version = "0.29.0", features = ["bundled"] } 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
rand = "0.8"
rand_core = "0.6"
tauri-plugin-log = { version = "2.0.0-rc" }
log = "0.4"
dirs = "5.0"
calamine = "0.22"
anyhow = "1.0" 

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
