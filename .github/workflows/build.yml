name: Build Tauri Application

on:
  push:
    branches: [ master, develop, flowrate-approach-dev]
  # pull_request:
  #   branches: [ master, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [ubuntu-latest, windows-latest, macos-latest]
        os: [windows-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install frontend dependencies
      run: npm ci
      
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
        
    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Tauri on macOS uses native frameworks and doesn't require additional system dependencies
        echo "No additional dependencies needed for macOS"
      
    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          src-tauri/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Install Tauri CLI
      run: npm install -g @tauri-apps/cli@latest
        
    - name: Build Tauri application
      run: npm run tauri build
      env:
        GITHUB_TOKEN: ${{ secrets.YUL_GITHUB_TOKEN }}
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ecl-app-${{ matrix.os }}
        path: src-tauri/target/release/bundle/
        retention-days: 30
